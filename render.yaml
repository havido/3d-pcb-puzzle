# Render blueprint for the kicad2cad API (Dashboard → New → Blueprint → pick this repo).
services:
  - type: web
    name: kicad2cad-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn api.main:app --app-dir web --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: MPLCONFIGDIR          # matplotlib needs a writable cache dir
        value: /tmp/mpl
      - key: KICAD2CAD_STORAGE     # boards + conversion results (ephemeral on free plans)
        value: /tmp/kicad2cad-web
      - key: ALLOWED_ORIGINS       # set to your Vercel URL once the frontend is deployed
        value: "*"
