# kicad2cad fabrication preset for 3DPCB boards (use: kicad2cad BOARD -o OUT --recipe params/3dpcb.yaml).
# Every tunable number in one place (CLAUDE.md rule). Defaults until the coupon test (#10) replaces
# them with measured values. Without --recipe, kicad2cad does a plain conversion (no extras).
copper_layer: F.Cu          # this layer becomes raised copper; other copper layers are ignored (single-sided)
base_thickness: 2.0         # mm of plastic under the copper
copper_raise: 0.6           # mm the copper stands above the base
arc_chord_mm: 0.02          # max error (mm) when approximating arcs and circles
include_zones: true
include_copper_graphics: true

min_drill: 1.0              # CLAUDE.md: holes ≥ 1 mm
small_drill: enlarge        # enlarge | skip | keep: what happens to drills narrower than min_drill

alignment_holes:            # holes for the cutter plate's pins (#29)
  diameter: 3.0             # mm
  positions: auto           # auto = near two opposite corners; or a list of [x, y] in KiCad mm
  clearance: 3.0            # mm kept free around each hole (copper, other holes, board edge)

# Board-specific cuts from user layers, e.g. for the goose (see docs/goose_spec.md, #12):
# extra_layers:
#   User.1: {op: recess, depth: 1.5}    # channels: lower the surface by 1.5 mm
#   User.2: {op: pocket, depth: 1.0}    # organ seat pockets
#   User.3: {op: through}               # cut all the way through
